# This config belongs only to the linux-terminal server, not other tmux servers.
set -g default-shell /bin/bash
set -g default-terminal tmux-256color
set -g history-limit 10000
# Handle real wheel events instead of Konsole's alternate-screen arrow emulation.
# Mouse-aware applications keep native scrolling; other programs use scrollback,
# including alternate-screen CLIs that do not implement mouse input.
set -g mouse on
bind -n WheelUpPane {
    if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
        send-keys -M
    } {
        copy-mode -et=
        send-keys -M
    }
}
bind -n WheelDownPane {
    if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M }
}
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 3 scroll-down
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down
set -g destroy-unattached off
set -g detach-on-destroy on
setw -g window-size latest
set -g status-interval 30
set -g set-titles on
set -g set-titles-string '#{b:pane_current_path} · #{pane_current_command}'
set -g status-style 'bg=#1b1e20,fg=#bdc3c7'
set -g status-left '#[fg=#3daee9,bold] Arch #[default] '
set -g status-left-length 12
set -g status-right '#[fg=#7f8c8d] C-b w:任务  C-b c:新建 '
set -g status-right-length 32
set -g window-status-format ' #I #W '
set -g window-status-current-format '#[bg=#3daee9,fg=#1b1e20,bold] #I #W #[default]'
set -g window-status-style 'fg=#7f8c8d'
set -g message-style 'bg=#3daee9,fg=#1b1e20'
set -g pane-border-style 'fg=#4d4d4d'
set -g pane-active-border-style 'fg=#3daee9'
setw -g mode-style 'bg=#3daee9,fg=#1b1e20'
setw -g automatic-rename on
setw -g allow-rename off
bind-key w choose-tree -Zw
