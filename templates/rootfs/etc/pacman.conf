[options]
Architecture = auto
HoldPkg = pacman glibc
IgnorePkg = fakeroot kwin xorg-xwayland mesa mesa-docs vulkan-freedreno vulkan-mesa-implicit-layers vulkan-mesa-layers
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 2
# Android mount tables do not expose a conventional root mount; CheckSpace omitted.

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
